<text x="56" y="408" fill="#7D8998" font-size="16" font-weight="400" font-family="'Amazon Ember', 'Noto Sans CJK KR', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="start">위 행은 런타임 생성/업데이트 시 1회, 아래 행은 새 세션마다</text>
<text x="808" y="440" fill="#7D8998" font-size="16" font-weight="400" font-family="'Amazon Ember', 'Noto Sans CJK KR', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="start">런타임 생성에서 READY까지 185초에서 216초</text>
