<text x="808" y="604" fill="#01A88D" font-size="16" font-weight="400" font-family="'Amazon Ember Mono', 'Noto Sans CJK KR', ui-monospace, monospace" text-anchor="start">200 MB 1.77초 / 1 GB 1.74초 / 2 GB 1.81초</text>
