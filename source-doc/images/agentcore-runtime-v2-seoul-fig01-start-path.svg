<text x="56" y="128" fill="#7D8998" font-size="16" font-weight="400" font-family="'Amazon Ember', 'Noto Sans CJK KR', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="start">사전 초기화 환경이 소진되면 새 세션마다 전체 시작 절차를 반복</text>
<text x="296" y="276" fill="#7D8998" font-size="16" font-weight="400" font-family="'Amazon Ember', 'Noto Sans CJK KR', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="start">서울 리전 cold start p75 (이미지 크기에 비례)</text>
<text x="296" y="304" fill="#232F3E" font-size="16" font-weight="400" font-family="'Amazon Ember Mono', 'Noto Sans CJK KR', ui-monospace, monospace" text-anchor="start">200 MB 5.37초 / 1 GB 13.41초 / 2 GB 27.51초</text>
<text x="824" y="276" fill="#7D8998" font-size="16" font-weight="400" font-family="'Amazon Ember', 'Noto Sans CJK KR', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="start">사전 초기화 환경에 배정된 세션</text>
<text x="824" y="304" fill="#232F3E" font-size="16" font-weight="400" font-family="'Amazon Ember', 'Noto Sans CJK KR', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="start">0.4초 안팎, 엔드포인트당 약 10개</text>
