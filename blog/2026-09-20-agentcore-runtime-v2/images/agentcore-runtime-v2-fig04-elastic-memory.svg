<text x="172" y="672" fill="#545B64" font-size="16" font-weight="400" font-family="'Amazon Ember', 'Noto Sans CJK KR', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="start">대조군 (할당 없음, 같은 세션 모양)</text>
<rect x="472" y="654" width="40" height="24" rx="4" fill="#232F3E" fill-opacity="0.15" stroke="#232F3E"/>
<text x="524" y="672" fill="#545B64" font-size="16" font-weight="400" font-family="'Amazon Ember', 'Noto Sans CJK KR', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="start">V1 스파이크 후</text>
<rect x="676" y="654" width="40" height="24" rx="4" fill="#01A88D" fill-opacity="0.18" stroke="#01A88D"/>
<text x="728" y="672" fill="#545B64" font-size="16" font-weight="400" font-family="'Amazon Ember', 'Noto Sans CJK KR', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="start">V2 스파이크 후</text>
