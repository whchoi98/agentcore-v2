<text x="400" y="640" fill="#545B64" font-size="16" font-weight="400" font-family="'Amazon Ember Mono', 'Noto Sans CJK KR', ui-monospace, monospace" text-anchor="middle">GB-hours 2.23배</text>
<rect x="696" y="452" width="160" height="132" rx="2" fill="#232F3E" fill-opacity="0.05" stroke="#232F3E" stroke-width="1.2" stroke-dasharray="4,3"/>
<rect x="904" y="432" width="160" height="152" rx="2" fill="#01A88D" fill-opacity="0.18" stroke="#01A88D" stroke-width="1.2"/>
<text x="776" y="440" fill="#545B64" font-size="16" font-weight="400" font-family="'Amazon Ember Mono', 'Noto Sans CJK KR', ui-monospace, monospace" text-anchor="middle">1.11 GB</text>
<text x="984" y="420" fill="#01A88D" font-size="16" font-weight="400" font-family="'Amazon Ember Mono', 'Noto Sans CJK KR', ui-monospace, monospace" text-anchor="middle">1.27 GB</text>
<text x="984" y="396" fill="#EC7211" font-size="16" font-weight="400" font-family="'Amazon Ember Mono', 'Noto Sans CJK KR', ui-monospace, monospace" text-anchor="middle">+0.16 GB 잔존</text>
<text x="880" y="616" fill="#01A88D" font-size="20" font-weight="600" font-family="'Amazon Ember', 'Noto Sans CJK KR', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">V2</text>
<text x="880" y="640" fill="#545B64" font-size="16" font-weight="400" font-family="'Amazon Ember Mono', 'Noto Sans CJK KR', ui-monospace, monospace" text-anchor="middle">GB-hours 1.17배, 약 92% 회수</text>
<text x="40" y="44" fill="#232F3E" font-size="20" font-weight="600" font-family="'Amazon Ember', 'Noto Sans CJK KR', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="start">1.5 GB 할당 후 해제한 세션의 과금 footprint (레그당 4세션, 세션-시간 약 0.10 h)</text>
