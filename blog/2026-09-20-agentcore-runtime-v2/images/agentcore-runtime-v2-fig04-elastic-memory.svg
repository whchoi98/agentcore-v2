<line x1="120" y1="464" x2="1200" y2="464" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
<text x="104" y="468" fill="#545B64" font-size="16" font-weight="400" font-family="'Amazon Ember Mono', 'Noto Sans CJK KR', ui-monospace, monospace" text-anchor="end">1</text>
<line x1="120" y1="344" x2="1200" y2="344" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
<text x="104" y="348" fill="#545B64" font-size="16" font-weight="400" font-family="'Amazon Ember Mono', 'Noto Sans CJK KR', ui-monospace, monospace" text-anchor="end">2</text>
<line x1="120" y1="224" x2="1200" y2="224" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
<text x="104" y="228" fill="#545B64" font-size="16" font-weight="400" font-family="'Amazon Ember Mono', 'Noto Sans CJK KR', ui-monospace, monospace" text-anchor="end">3</text>
<line x1="120" y1="104" x2="1200" y2="104" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
<text x="104" y="108" fill="#545B64" font-size="16" font-weight="400" font-family="'Amazon Ember Mono', 'Noto Sans CJK KR', ui-monospace, monospace" text-anchor="end">4</text>
<text x="104" y="84" fill="#7D8998" font-size="16" font-weight="400" font-family="'Amazon Ember', 'Noto Sans CJK KR', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="end">GB</text>
<text x="1200" y="96" fill="#7D8998" font-size="16" font-weight="400" font-family="'Amazon Ember Mono', 'Noto Sans CJK KR', ui-monospace, monospace" text-anchor="end">RSS 실측: 50.8 MB, 최고 1,593.8 MB, 해제 후 52.9 MB</text>
<rect x="216" y="380" width="160" height="204" rx="2" fill="#232F3E" fill-opacity="0.05" stroke="#232F3E" stroke-width="1.2" stroke-dasharray="4,3"/>
<rect x="424" y="148" width="160" height="436" rx="2" fill="#232F3E" fill-opacity="0.18" stroke="#232F3E" stroke-width="1.2"/>
<text x="296" y="368" fill="#545B64" font-size="16" font-weight="400" font-family="'Amazon Ember Mono', 'Noto Sans CJK KR', ui-monospace, monospace" text-anchor="middle">1.69 GB</text>
<text x="504" y="136" fill="#232F3E" font-size="16" font-weight="400" font-family="'Amazon Ember Mono', 'Noto Sans CJK KR', ui-monospace, monospace" text-anchor="middle">3.64 GB</text>
<text x="504" y="112" fill="#EC7211" font-size="16" font-weight="400" font-family="'Amazon Ember Mono', 'Noto Sans CJK KR', ui-monospace, monospace" text-anchor="middle">+1.95 GB 잔존</text>
